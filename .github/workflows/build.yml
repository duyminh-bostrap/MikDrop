name: Build binaries

# Tạo file chạy độc lập (không cần cài Node.js) cho Windows và Linux.
# Chạy tay (Actions → Build binaries → Run workflow) hoặc khi đẩy tag dạng v1.2.3.
# Nếu có tag (đẩy tag, hoặc nhập ô "tag" khi chạy tay) thì đăng luôn các file lên GitHub Release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release để đăng file lên, ví dụ v1.4.0 (bỏ trống = chỉ build, không đăng)'
        required: false
        type: string
  push:
    tags: ['v*']

# Runner Linux được ghim ở ubuntu-24.04 (không dùng ubuntu-latest) để môi trường build ổn định, không tự đổi khi
# GitHub chuyển nhãn "latest" sang Ubuntu mới. Lưu ý: file Linux là bản sao của node chính thức (setup-node) nên
# yêu cầu glibc do bản Node quyết định, không phụ thuộc vào runner này.
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build:exe
            artifact: MikDrop-windows-x64
            path: dist/MikDrop.exe
          - os: ubuntu-24.04
            script: build:linux
            artifact: mikdrop-linux-x64
            path: dist/mikdrop-linux-x64
          - os: ubuntu-24.04-arm
            script: build:linux
            artifact: mikdrop-linux-arm64
            path: dist/mikdrop-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.script }}

      # Chạy thử file vừa build trên chính runner (x64 và arm64 đều là máy thật) để chắc chắn nó khởi động được
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          nohup ./${{ matrix.path }} --no-open --keep-alive --port 3199 > run.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3199/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:3199/healthz; echo
          curl -fsS http://127.0.0.1:3199/ | grep -q "MikDrop"
          curl -fsS http://127.0.0.1:3199/vendor/socket.io.min.js -o /dev/null
          curl -fsS "http://127.0.0.1:3199/api/qr.svg?u=http%3A%2F%2F192.168.1.2%3A3199" | head -c 60; echo
          curl -fsS "http://127.0.0.1:3199/socket.io/?EIO=4&transport=polling" | head -c 80; echo
          curl -fsS http://127.0.0.1:3199/api/config; echo
          echo "--- log ---"; cat run.log
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath ./dist/MikDrop.exe -ArgumentList '--no-open','--keep-alive','--port','3199'
          Start-Sleep -Seconds 5
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3199/healthz).Content
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3199/vendor/socket.io.min.js).StatusCode

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mikdrop .
      - name: Smoke test (Docker)
        run: |
          docker run -d --name md -p 3198:3000 -e TRUST_PROXY=1 mikdrop
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3198/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:3198/healthz; echo
          curl -fsS http://127.0.0.1:3198/vendor/socket.io.min.js -o /dev/null
          curl -fsS "http://127.0.0.1:3198/api/qr.svg?u=http%3A%2F%2F192.168.1.2" | head -c 60; echo
          docker ps --filter name=md --format '{{.Status}}'
          docker logs md

  release:
    needs: [build, docker]
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update release
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
          else
            gh release create "$TAG" * --title "MikDrop ${TAG#v}" --generate-notes --target "$GITHUB_SHA"
          fi
